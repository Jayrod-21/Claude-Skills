# Deploy Template — EC2 via SSH (Docker Compose)
# Copy to your project's .github/workflows/deploy.yml and customize.
#
# Pattern: Triggers ONLY when CI passes on main. Never deploys on PRs or feature branches.
#
# Required GitHub Secrets:
#   SERVER_HOST — EC2 public IP or hostname
#   SERVER_USER — SSH username (e.g., ubuntu)
#   SERVER_SSH_KEY — Private SSH key for deployment

name: Deploy

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    steps:
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script_stop: true
          script: |
            cd /opt/your-project               # ← customize path
            git fetch origin main
            git reset --hard origin/main

            # Rebuild and restart
            docker compose -f docker-compose.prod.yml down --timeout 30 --remove-orphans || true
            docker compose -f docker-compose.prod.yml build
            docker compose -f docker-compose.prod.yml up -d --force-recreate --remove-orphans

            # Run migrations if applicable
            # docker exec -i your-db psql -U user -d dbname < database/migrations/*.sql

            # Health check
            echo "=== Health check ==="
            curl -sf http://localhost/api/health || (echo "Health check FAILED!" && exit 1)
            echo "Deploy complete!"
